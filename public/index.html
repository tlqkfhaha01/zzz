<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>밤의 마을 온라인</title><script src="/socket.io/socket.io.js"></script><style>body{margin:0;background:#101321;color:#f4f6ff;font:16px system-ui}.wrap{max-width:760px;margin:30px auto;padding:16px}.card{background:#1a2033;border:1px solid #39415c;border-radius:16px;padding:20px;margin:14px 0}input,button{padding:12px;border-radius:9px;border:0;margin:5px}input{background:#101827;color:white}button{background:#8c7bff;color:white;font-weight:bold;cursor:pointer}.muted{color:#aab3ca}.players{display:flex;flex-wrap:wrap;gap:8px}.player{background:#101827;padding:10px;border-radius:8px}.log{line-height:1.8}</style><div class="wrap"><h1>🌙 밤의 마을 온라인</h1><section class="card" id="home"><p>닉네임</p><input id="name" placeholder="닉네임"><p><button onclick="create()">방 만들기 (AI 3명 포함)</button></p><p class="muted">친구의 방 코드 입력</p><input id="code" placeholder="방 코드"><button onclick="join()">참가</button><p id="err"></p></section><section class="card" id="game" hidden><h2 id="status"></h2><p>방 코드: <b id="room"></b> — 친구에게 공유하세요.</p><div class="players" id="players"></div><h3>내 역할: <span id="role"></span></h3><div id="actions"></div><div class="log" id="log"></div></section></div><script>const s=io();let host=false,me=null,state=null;const $=x=>document.getElementById(x);function create(){s.emit("create",{name:$("name").value,ai:3},r=>{if(!r.ok)$("err").textContent=r.error})}function join(){s.emit("join",{name:$("name").value,code:$("code").value},r=>{if(!r.ok)$("err").textContent=r.error})}s.on("state",d=>{state=d;me=d.me;host=d.room.host===me.id; if(d.room.host===me.id)host=true;$("home").hidden=true;$("game").hidden=false;$("room").textContent=d.room.code;$("status").textContent=d.room.phase+" · "+d.room.round+"일차";$("players").innerHTML=d.room.players.map(p=>'<span class="player">'+(p.alive?"🟢":"⚫")+p.name+(p.ai?" (AI)":"")+'</span>').join("");$("role").textContent=me.role||"대기 중";$("log").innerHTML=d.room.log.join("<br>");let a="";if(d.room.status==="lobby"&&host)a+='<button onclick="s.emit(\'start\',{},r=>{if(!r.ok)alert(r.error)})">게임 시작</button>';if(d.room.phase==="밤"&&me.alive&&["마피아","의사"].includes(me.role))a+='<p>행동할 대상을 선택하세요.</p>'+d.room.players.filter(p=>p.alive&&p.id!==me.id).map(p=>'<button onclick="s.emit(\'action\',{target:\''+p.id+'\'},r=>{if(!r.ok)alert(r.error)})">'+p.name+'</button>').join("");if(d.room.phase==="낮"&&host)a+='<button onclick="s.emit(\'voteStart\',{},r=>{if(!r.ok)alert(r.error)})">투표 시작</button>';if(d.room.phase==="투표"&&me.alive)a+=d.room.players.filter(p=>p.alive&&p.id!==me.id).map(p=>'<button onclick="s.emit(\'vote\',{target:\''+p.id+'\'},r=>{if(!r.ok)alert(r.error)})">'+p.name+'에게 투표</button>').join("")+'<button onclick="s.emit(\'vote\',{target:null})">기권</button>';if(d.room.status==="ended")a+='<h2>'+d.room.winner+' 팀 승리!</h2>'; $("actions").innerHTML=a});</script></html>
